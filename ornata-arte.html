<script src="./smooth-scroll.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--acc:var(--acc-dark,#C9F24E);--bg:#0F0E0C;--sur:#171512;--line:#2A2723;--ink:#ECE8E0;--mut:#8F8A80}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--acc)}
.disp{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.92;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.mut{color:var(--mut)}
.acc{color:var(--acc)}
.sec{padding:110px 64px;border-top:1px solid var(--line)}
.wrap{max-width:1280px;margin:0 auto}
.kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.h2{font-size:clamp(48px,7vw,96px)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border:1px solid var(--ink);border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:none;color:var(--ink);transition:all .2s}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#0F0E0C}
.btn.solid{background:var(--acc);border-color:var(--acc);color:#0F0E0C}
.btn.solid:hover{background:var(--ink);border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--sur);display:block;transition:border-color .2s}
.card:hover{border-color:var(--acc);color:var(--ink)}
.thumb{height:340px;position:relative;background:var(--thumb)}
:root{--thumb:#1B1916}
html.light{--thumb:#E4E1D9}
.cmeta{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tag.hl{color:#0F0E0C;background:var(--acc);border-color:var(--acc)}
.navlink{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.navlink:hover{color:var(--acc)}
.slink{border:1px solid var(--line);border-radius:999px;padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.slink:hover{border-color:var(--acc)}
.rv{display:block;overflow:hidden}
.rvi{display:inline-block;transform:translateY(115%);transition:transform .9s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.rv.in .rvi{transform:translateY(0)}
.fadeup{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .8s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.fadeup.in{opacity:1;transform:translateY(0)}
html.light{--acc:#E2DB00;--bg:#EFEDE9;--sur:#FFFFFF;--line:#D8D4CB;--ink:#131210;--mut:#7A756B}
html.light .logoimg{filter:invert(1)}
@media (pointer:fine){html,body,a,button,input,textarea,label,.btn,.card,.dotsbtn,.xbtn,.mlink,.navlink,.slink{cursor:none !important}}
.navbar{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.dotsbtn{width:46px;height:46px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;transition:background .25s}
.dotsbtn:hover{background:var(--sur)}
.dgrid{display:grid;grid-template-columns:3px 3px;gap:9px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.dotsbtn:hover .dgrid{transform:rotate(45deg)}
.d{width:3px;height:3px;border-radius:50%;background:var(--ink)}
.menu{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;justify-content:space-between;padding:24px 64px;box-sizing:border-box;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
.menu.open{opacity:1;visibility:visible}
.mline{overflow:hidden;text-align:center;padding:0 30px}
.mlink{display:inline-block;font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(56px,8.5vw,110px);line-height:1.02;color:var(--ink);transform:translateY(110%);transition:transform .25s ease,color .2s;position:relative}
.roll{display:block;position:relative;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.rt2{position:absolute;top:100%;left:0;width:100%}
.mlink:hover .roll{transform:translateY(-100%)}
.msup{font-family:'JetBrains Mono',monospace;font-size:14px;position:absolute;top:10px;left:-26px;color:var(--ink);opacity:0;transition:opacity .25s}
.mlink:hover .msup{opacity:1}
.menu.open .mline:nth-child(1) .mlink{transition-delay:.2s}
.menu.open .mline:nth-child(2) .mlink{transition-delay:.28s}
.menu.open .mline:nth-child(3) .mlink{transition-delay:.36s}
.menu.open .mlink{transform:translateY(0);transition:transform .7s cubic-bezier(.16,1,.3,1),color .2s}
.xbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--sur);color:var(--ink);display:grid;place-items:center;font-size:16px;transition:transform .3s}
.xbtn:hover{transform:rotate(90deg)}
.cursordot{display:none !important}
@media (pointer:fine){.cursordot{display:flex !important}}
html.om-editing, html.om-editing *{cursor:auto !important}
html.om-editing .cursordot{display:none !important}
html.om-host, html.om-host *{cursor:auto !important}
html.om-host .cursordot{display:none !important}
.cursordot{position:fixed;left:-100px;top:-100px;z-index:2147483647;pointer-events:none;width:14px;height:14px;border-radius:999px;background:#fff;mix-blend-mode:difference;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:width .3s cubic-bezier(.22,1,.36,1),height .3s cubic-bezier(.22,1,.36,1),background .2s}
.cursordot.hov{width:36px;height:36px}
.cursordot.view{width:72px;height:40px;background:#fff;mix-blend-mode:normal;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.vtext{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;color:#0F0E0C;opacity:0;transition:opacity .2s}
.cursordot.view .vtext{opacity:1;transition-delay:.1s}
.mailic{display:none;flex-shrink:0}
@media (max-width:920px){
.sec{padding:72px 24px}
.navbar{padding:14px 24px !important}
.menu{padding:20px 24px}
.menu .btn{padding:10px 16px;font-size:11px}
.menu>.fx.jb{flex-direction:column;gap:16px;align-items:center}
.msup{display:none}
#worktop{padding:120px 24px 0 !important}
.mailic{display:inline-block}
.navbar .btn .btntxt{display:none}
.navbar .btn{padding:14px !important}
.mailic{width:18px;height:18px}
#work .wrap>.grid{grid-template-columns:1fr !important}
.lgrid{grid-template-columns:1fr !important}
.thumb{height:240px}
footer{flex-wrap:wrap;gap:14px;padding:24px 24px !important;justify-content:center !important}
}
@media (max-width:600px){
.cmeta{flex-direction:column;align-items:flex-start}
}
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9F24E&quot;,&quot;options&quot;:[&quot;#C9F24E&quot;,&quot;#FF7A45&quot;,&quot;#6EE7F2&quot;,&quot;#9D8CFF&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, light: localStorage.getItem('akhilux-theme') === 'light' };
  componentDidMount() {
    this.applyAccent();
    document.documentElement.classList.toggle('light', this.state.light);
    const reveal = () => {
      const vh = window.innerHeight;
      document.querySelectorAll('.rv:not(.in),.fadeup:not(.in)').forEach(el => {
        if (el.getBoundingClientRect().top < vh * 0.92) el.classList.add('in');
      });
    };
    requestAnimationFrame(reveal);
    this.revealTimer = setInterval(() => {
      reveal();
      if (!document.querySelector('.rv:not(.in),.fadeup:not(.in)')) clearInterval(this.revealTimer);
    }, 200);
    let c = document.getElementById('om-cursor');
    if (!c) {
      c = document.createElement('div');
      c.id = 'om-cursor';
      c.className = 'cursordot';
      c.innerHTML = '<span class="vtext">VIEW</span>';
      document.body.appendChild(c);
    }
    this.cursorEl = c;
    this.cursorMove = e => {
      c.style.left = e.clientX + 'px';
      c.style.top = e.clientY + 'px';
      const t = e.target instanceof Element ? e.target : null;
      const card = t && t.closest('#work .card');
      const hov = t && t.closest('a,button,input,textarea,.inp');
      c.classList.toggle('view', !!card);
      c.classList.toggle('hov', !card && !!hov);
    };
    document.addEventListener('mousemove', this.cursorMove);
    this.editChk = () => {
      const ae = document.activeElement;
      const editing = !!(ae && ae.closest && ae.closest('[contenteditable], input, textarea'));
      document.documentElement.classList.toggle('om-editing', editing);
    };
    document.addEventListener('focusin', this.editChk);
    this.editChkOut = () => setTimeout(this.editChk, 0);
    document.addEventListener('focusout', this.editChkOut);
    try { if (window.top !== window.self) document.documentElement.classList.add('om-host'); } catch (e) { document.documentElement.classList.add('om-host'); }
  }
  componentWillUnmount() {
    document.removeEventListener('focusin', this.editChk);
    document.removeEventListener('focusout', this.editChkOut);
    document.removeEventListener('mousemove', this.cursorMove);
    if (this.cursorEl) this.cursorEl.remove();
    if (this.revealTimer) clearInterval(this.revealTimer);
  }
  componentDidUpdate() {
    this.applyAccent();
    document.documentElement.classList.toggle('light', this.state.light);
  }
  applyAccent() {
    const acc = this.props.accent ?? '#C9F24E';
    document.documentElement.style.setProperty('--acc-dark', acc);
  }
  renderVals() {
    return {
            menuCls: this.state.menuOpen ? 'open' : '',
      themeLabel: this.state.light ? 'Switch to dark mode' : 'Switch to light mode',
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      toggleTheme: () => this.setState(s => {
        const light = !s.light;
        localStorage.setItem('akhilux-theme', light ? 'light' : 'dark');
        return { light };
      })
    };
  }
}
</script>
